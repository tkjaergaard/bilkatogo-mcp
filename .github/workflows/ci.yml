name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Node won't strip types under node_modules, so npx runs the built
      # JavaScript: pack the package and run it the way npx installs it.
      - name: Run the packed package through npx
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npx -y --package="./bilkatogo-mcp-$(node -p 'require(process.env.GITHUB_WORKSPACE + "/package.json").version').tgz" bilkatogo-mcp --version
