# Releases through a release PR (release-please). Each push to main updates a
# standing "chore(main): release x.y.z" PR with the version bump and the
# changelog, worked out from the Conventional Commit messages. Merging that PR
# tags the release, creates the GitHub release and publishes to npm.
#
# npm publishing uses trusted publishing (OIDC), so there's no npm token in
# the repo's secrets. Every action is pinned to a commit. See docs/releasing.md.

name: Release

on:
  push:
    branches: [main]
  # Recomputes the release PR, e.g. after the first release was tagged by hand.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Pinned to the v5.0.0 commit: this third-party action can push to the repo.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Installs, checks and packs without the right to publish: an install
  # script from a dependency runs here, never next to the publish token.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # prepack builds dist/ into the tarball.
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: bilkatogo-mcp-*.tgz
          if-no-files-found: error
          retention-days: 7

  # Publishes the tarball the build job packed. Nothing is installed or run
  # from the package here, so only the npm CLI holds the OIDC token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      # Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: npm publish --ignore-scripts ./bilkatogo-mcp-*.tgz
