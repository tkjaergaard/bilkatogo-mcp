# Releases through a release PR (release-please). Each push to main updates a
# standing "chore(main): release x.y.z" PR with the version bump and the
# changelog, worked out from the Conventional Commit messages. Merging that PR
# tags the release, creates the GitHub release and publishes to npm.
#
# npm publishing uses trusted publishing (OIDC), so there's no npm token in
# the repo's secrets. See docs/releasing.md.

name: Release

on:
  push:
    branches: [main]
  # Recomputes the release PR, e.g. after the first release was tagged by hand.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Pinned to the v5.0.0 commit: this third-party action can push to the repo.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      # prepack builds dist/. Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
      - run: npm publish
